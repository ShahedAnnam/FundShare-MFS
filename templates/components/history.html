<div class="tab-panel" id="tab-history">
  <div class="page-heading"><div><p class="eyebrow">EVERY TRANSACTION, ALL TOGETHER</p><h1>History</h1></div><button class="icon-button" title="Refresh history" aria-label="Refresh history" onclick="loadTxnHistory(currentTxnFilter)"><i data-lucide="refresh-cw"></i></button></div>
  <div class="segmented-control history-modes" aria-label="History view"><button class="active" id="historyDetailsButton" onclick="setHistoryMode('details')">Transaction Details</button><button id="historySummaryButton" onclick="setHistoryMode('summary')">Transaction Summary</button></div>
  <div class="filter-strip" id="txnHistoryFilters" aria-label="Transaction type"><button class="ai-prompt-chip active" id="thf-all" onclick="loadTxnHistory('')">All</button><button class="ai-prompt-chip" id="thf-send" onclick="loadTxnHistory('SEND_MONEY')">Send Money</button><button class="ai-prompt-chip" id="thf-received" onclick="loadTxnHistory('RECEIVED_MONEY')">Received Money</button><button class="ai-prompt-chip" id="thf-pay" onclick="loadTxnHistory('MERCHANT_PAYMENT')">Make Payment</button><button class="ai-prompt-chip" id="thf-cashin" onclick="loadTxnHistory('CASH_IN')">Add Money</button><button class="ai-prompt-chip" id="thf-cashout" onclick="loadTxnHistory('CASH_OUT')">Cash Out</button><button class="ai-prompt-chip" id="thf-recharge" onclick="loadTxnHistory('MOBILE_RECHARGE')">Mobile Recharge</button><button class="ai-prompt-chip" id="thf-bill" onclick="loadTxnHistory('BILL_PAYMENT')">Pay Bill</button></div>
  <div id="historySummary" hidden></div><div id="fullTxnList"></div>
</div>
